<!doctype html>
<html><head><meta charset="utf-8"><title>test</title></head>
<body>
<pre id="out">running</pre>
<iframe id="f" src="/?debug" style="width:1280px;height:800px"></iframe>
<script>
const out = [];
const say = (s) => { out.push(s); console.log("SAY " + s); document.getElementById('out').textContent = out.join('\n'); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ok = (c, m) => say((c ? 'ok   ' : 'FAIL ') + m);
const Q = new URLSearchParams(location.search);
const TMOD = 'AAEditorTest';    // a throwaway mod (sorts first: a running game keeps the owner's patches); removed at the end
async function until(f, ms = 30000) { for (let t = 0; t < ms; t += 100) { if (f()) return true; await sleep(100); } return false; }
// the page's question dialog: click the button with this value (when it is open)
function answer(doc, v) { const d = doc.getElementById('askDlg'), b = d.open && d.querySelector(`#askBtns button[value="${v}"]`); if (b) b.click(); return !!b; }
const failConfirm = () => { say('FAIL window.confirm was called'); return false; };
// passos 9 e 10: Settings (sections, badges from /api/paths, Advanced, Browse), the dialogs (Test, stage, mod, New mod, Save into
// which mod), the check as the server gives it (problems that select their object), the winning mod's note
async function steps910(D, doc, W) {
  const $ = (id) => doc.getElementById(id), F = W.fetch.bind(W);
  const postJ = (p, b) => F(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then((r) => r.json());
  const btns = () => [...$('askDlg').querySelectorAll('#askBtns button')].map((b) => b.textContent).join('|');
  const lastToast = () => [...$('toasts').querySelectorAll('.toast')].pop();
  const ini = await F('/api/init').then((r) => r.json());
  const mod0 = D.modNow;
  const loaded = () => until(() => doc.getElementById('busy').hidden && D.items().length, 60000);
  // work in the throwaway mod (nothing is saved below: every save is stubbed)
  D.select(null);
  D.switchMod(TMOD); answer(doc, 'discard');
  ok(await until(() => D.modNow === TMOD) && await loaded(), 'in the test mod ' + D.modNow);
  // --- 10: the winning mod's note at load (Teste and LevelTest have CENTRAL.json, and sort after AAEditorTest)
  const win = D.winnerOf(D.stageHave, TMOD);
  ok(D.stageHave.length && win !== TMOD && !$('winNote').hidden && $('winText').textContent.includes(`Mod "${win}" also changes Midtown and loads after "${TMOD}"`),
     `winner note at load: have ${D.stageHave.join(',')}: ${$('winText').textContent}`);
  $('winClose').click();
  ok($('winNote').hidden, 'the note closes');
  // --- 9: Settings
  D.openSettings();
  ok($('dlg').open && [...doc.querySelectorAll('#dlg .dlg-body > .sec-title')].map((e) => e.textContent).join('|') === 'Appearance|Game files' &&
     doc.querySelectorAll('#sTheme input').length === 3, 'settings: sections ' + [...doc.querySelectorAll('#dlg .sec-title')].map((e) => e.textContent).join('|'));
  ok($('sAdv').hidden === !ini.clone && doc.querySelectorAll('#dlg .browse:not([hidden])').length === (ini.canBrowse ? 6 : 0),
     `advanced only in a clone (clone ${ini.clone}, hidden ${$('sAdv').hidden}); browse only in the window (canBrowse ${ini.canBrowse})`);
  await D.checkPaths(0);
  const badge = (k) => doc.querySelector(`#dlg .pstate[data-for="${k}"]`), why = (k) => doc.querySelector(`#dlg .perr[data-for="${k}"]`);
  ok(badge('disc').classList.contains('ok') && /Found/.test(badge('disc').textContent) && /stages/.test(badge('disc').title) && why('disc').hidden,
     `disc badge: ${badge('disc').textContent} (${badge('disc').title})`);
  ok(badge('mods').classList.contains('ok'), 'mods badge: ' + badge('mods').textContent + ' (' + badge('mods').title + ')');
  $('sDisc').value = 'C:\\nope\\nothing.iso'; $('sDisc').dispatchEvent(new Event('input'));
  ok(await until(() => badge('disc').classList.contains('err'), 5000) && /Not found/.test(badge('disc').textContent) && !why('disc').hidden && /moved or renamed/.test(why('disc').textContent),
     `a disc that does not exist: ${badge('disc').textContent}: ${why('disc').textContent}`);
  $('sDisc').value = 'C:\\Windows'; $('sDisc').dispatchEvent(new Event('input'));
  ok(await until(() => /Not a disc/.test(badge('disc').textContent), 5000) && /LVL and PTS/.test(why('disc').textContent), 'a folder that is not a disc: ' + why('disc').textContent);
  const r0 = await postJ('/api/paths', { disc: 'C:\\nope\\x.iso', game: '', mods: '' });
  ok(r0.disc.short === 'Not found' && r0.game.state === 'warn' && r0.mods.state === 'err', '/api/paths: ' + JSON.stringify(r0));
  const rb = await F('/api/browse', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"kind":"disc"}' });
  ok(ini.canBrowse || rb.status === 400, 'browse outside the window: ' + rb.status);
  doc.querySelector('#dlg .dlg-foot [data-close]').click();
  ok(!$('dlg').open, 'Cancel closes Settings');
  await sleep(100);
  // Save with no new disc or mods folder: the scene stays (the unsaved change too)
  const it = D.items().find((x) => !x.copy && x.rec.info.kind === 'destr' && x.node.visible && !x.attached.length);
  await sleep(800); D.select(it); D.nudge(1, 0, 0, false);
  const hl = D.history.length, p1 = JSON.stringify(D.buildPatch());
  D.openSettings();
  let fired = 0; $('dlg').addEventListener('close', () => fired++, { once: true });
  $('sOk').click();
  await sleep(150);
  ok(!$('dlg').open && $('dlg').returnValue === 'ok', 'Save closes Settings (' + $('dlg').returnValue + ')');
  if (!fired) $('dlg').dispatchEvent(new W.Event('close'));   // headless Edge: see steps23
  await until(() => doc.getElementById('busy').hidden, 5000); await sleep(500);
  ok(D.dirty && D.history.length === hl && JSON.stringify(D.buildPatch()) === p1 && D.modNow === TMOD, 'Settings saved: the scene and its unsaved change stay');
  // --- Test with unsaved changes
  const calls = [];
  let reply = {};
  W.fetch = (u, o) => {
    const m = /^\/api\/(save|test|reload|check)/.exec(String(u));
    if (!m) return F(u, o);
    calls.push({ kind: m[1], body: JSON.parse(o.body) });
    return Promise.resolve(new Response(JSON.stringify(reply[m[1]] || { ok: true, lines: [] }), { status: 200 }));
  };
  $('test').click();
  ok($('askDlg').open && $('askTitle').textContent === 'Save before testing?' && btns() === 'Cancel|Test without them|Save and test' &&
     /The game loads the saved file\. Your last change is not saved yet\./.test($('askText').textContent) && !$('askIcon').hidden,
     `Test with a change: ${$('askText').textContent} [${btns()}]`);
  answer(doc, 'nosave');
  await until(() => calls.length);
  ok(calls[0] && calls[0].kind === 'test' && calls[0].body.save === false && !$('askDlg').open, 'Test without them: ' + JSON.stringify(calls[0] && calls[0].body.save));
  D.setGameState('closed');
  // --- stage switch with unsaved changes
  calls.length = 0;
  const other = [...$('stage').options].map((o) => o.value).find((v) => v === 'UFO') || [...$('stage').options].find((o) => o.value !== 'CENTRAL').value;
  $('stage').value = other; $('stage').dispatchEvent(new Event('change'));
  ok($('askDlg').open && $('askTitle').textContent === 'Unsaved changes' && /^Midtown has 1 unsaved change\.$/.test($('askText').textContent) &&
     btns() === 'Cancel|Discard|Save and switch' && $('stage').value === 'CENTRAL', `stage switch asks: ${$('askText').textContent} [${btns()}]`);
  answer(doc, 'cancel');
  ok($('stage').value === 'CENTRAL' && D.dirty && !calls.length, 'Cancel: still on Midtown, unsaved');
  reply.save = { ok: true, summary: 'Check passed: 1 moved. Collision OK.', problems: [], infos: [], lines: [], saved: 'C:\\x\\mods\\' + TMOD + '\\levels\\CENTRAL.json',
                 winner: TMOD, have: [TMOD] };
  $('stage').value = other; $('stage').dispatchEvent(new Event('change'));
  answer(doc, 'save');
  ok(await until(() => calls.some((c) => c.kind === 'save'), 5000) && await until(() => $('stage').value === other && doc.getElementById('busy').hidden && D.items().length, 60000),
     'Save and switch: saved (stub), then ' + other);
  $('stage').value = 'CENTRAL'; $('stage').dispatchEvent(new Event('change'));
  ok(!$('askDlg').open && await until(() => doc.getElementById('busy').hidden && D.items().length && /Midtown/.test($('sumStage').textContent), 60000), 'no changes: back to Midtown without asking');
  // --- New mod, then Move my changes
  const it2 = D.items().find((x) => !x.copy && x.rec.info.kind === 'destr' && x.node.visible && !x.attached.length);
  await sleep(800); D.select(it2); D.nudge(1, 0, 0, false);
  const p2 = JSON.stringify(D.buildPatch()), hl2 = D.history.length;
  $('mod').value = '__new__'; $('mod').dispatchEvent(new Event('change'));
  ok($('modDlg').open && $('mdTitle').textContent === 'New mod' && $('mdPickRow').hidden && !$('mdNameRow').hidden && $('mod').value === TMOD, 'New mod… opens the dialog');
  $('mdName').value = '_bad'; $('mdName').dispatchEvent(new Event('input'));
  ok(!$('mdErr').hidden && $('mdOk').disabled, 'a name with a leading _ is refused at once');
  $('mdName').value = 'AAEditorTest2'; $('mdName').dispatchEvent(new Event('input'));
  ok($('mdErr').hidden && !$('mdOk').disabled && /mods\/AAEditorTest2\/ is created when you save/.test($('mdHelp').textContent), 'a good name: ' + $('mdHelp').textContent);
  $('mdOk').click();
  await sleep(50);
  ok(!$('modDlg').open && $('askDlg').open && $('askTitle').textContent === 'Switch to mod "AAEditorTest2"?' && /1 unsaved change for AAEditorTest\./.test($('askText').textContent) &&
     btns() === 'Cancel|Discard and load AAEditorTest2|Move my changes to AAEditorTest2' && $('askNote').hidden, `then the switch asks: ${$('askText').textContent} [${btns()}]`);
  answer(doc, 'move');
  ok(D.modNow === 'AAEditorTest2' && $('mod').value === 'AAEditorTest2' && D.dirty && D.history.length === hl2 && JSON.stringify(D.buildPatch()) === p2 && doc.getElementById('busy').hidden,
     'Move my changes: the mod changes, the scene stays, unsaved');
  ok(/Your changes now go into mod "AAEditorTest2"/.test(lastToast().textContent), 'toast: ' + lastToast().textContent);
  // a mod that already changes the stage: the note says saving replaces its file
  D.stageHave = ['LevelTest', 'Teste'];
  D.switchMod('Teste');
  ok($('askDlg').open && !$('askNote').hidden && /Teste already changes this stage; saving will replace its file\./.test($('askNote').textContent), 'note: ' + $('askNote').textContent);
  answer(doc, 'cancel');
  ok(D.modNow === 'AAEditorTest2', 'cancelled');
  // --- Save with no mod: "Save into which mod?"
  D.setMod('');
  ok($('mod').value === '' && $('mod').closest('.field').classList.contains('none') && $('mod').options[0].textContent === 'Choose a mod', 'no mod: the picker says Choose a mod');
  calls.length = 0;
  if (!D.modList.includes(TMOD)) D.modList = D.modList.concat([TMOD]);
  const pr = D.post('save');
  await sleep(50);
  ok($('modDlg').open && $('mdTitle').textContent === 'Save into which mod?' && !$('mdPickRow').hidden && $('mdOk').textContent === 'Save', 'Save with no mod asks which');
  $('mdPick').value = 'Teste'; $('mdPick').dispatchEvent(new Event('change'));
  ok(!$('mdWarn').hidden && /saving will replace its file/.test($('mdWarnText').textContent), 'picking a mod with this stage warns');
  $('mdPick').value = TMOD; $('mdPick').dispatchEvent(new Event('change'));
  $('mdOk').click();
  const saved = await pr;
  ok(saved && calls.length === 1 && calls[0].body.mod === TMOD && D.modNow === TMOD, 'saved into ' + (calls[0] && calls[0].body.mod));
  // --- 10: the check from the server, in the Check tab; a problem selects its object
  const h = it2.rec.info.handle, real = await postJ('/api/check', { name: 'CENTRAL', patch: { objects: [{ handle: h, from: [0, 0, 0], pos: D.posOf(it2) }] } });
  ok(!real.ok && real.problems[0] && real.problems[0].handle === h && real.problems[0].kind === 'entry', `server: ${real.summary}; ${real.problems[0] && real.problems[0].text}`);
  reply.check = real;
  D.select(null);
  await D.post('check');
  const prob = $('checkOut').querySelector('.line.go');
  ok(doc.querySelector('#status .check').classList.contains('err') && /1 problem/.test(doc.querySelector('#status .check').textContent) && prob &&
     prob.textContent.includes(`${it2.iname || it2.rec.info.name} was not applied`), 'check tab: ' + (prob && prob.textContent));
  prob.click();
  ok(D.sel === it2, 'the problem selects ' + (D.sel && D.sel.rec.info.handle));
  const pass = await postJ('/api/check', { name: 'CENTRAL', patch: D.buildPatch() });
  reply.check = pass;
  await D.post('check');
  ok(pass.ok && /^Check passed: 1 moved\. Collision OK\.$/.test(pass.summary) && doc.querySelector('#status .check').classList.contains('ok'), 'a check that passes: ' + pass.summary);
  // Save with a failing check: it saves, and an amber toast says so
  reply.save = Object.assign({}, real, { saved: 'C:\\x\\mods\\' + TMOD + '\\levels\\CENTRAL.json', winner: TMOD, have: [TMOD] });
  await sleep(800); D.nudge(1, 0, 0, false);
  await D.post('save');
  ok(!D.dirty && lastToast().classList.contains('warn') && /Saved, but the check found 1 problem/.test(lastToast().textContent), 'failing save: ' + lastToast().textContent);
  // a save that another mod outranks: the note and a toast
  reply.save = Object.assign({}, pass, { saved: 'C:\\x', winner: 'Zeta', have: ['Zeta', TMOD] });
  await D.post('save');
  ok(!$('winNote').hidden && /Mod "Zeta" also changes Midtown/.test($('winText').textContent) && [...$('toasts').querySelectorAll('.toast.warn')].some((t) => /Zeta/.test(t.textContent)),
     'winner on save: ' + $('winText').textContent);
  W.fetch = F;
  // back: the first mod, nothing kept from the test
  D.resetAll(); D.applyPatch({});
  D.switchMod(mod0); answer(doc, 'discard');
  await until(() => D.modNow === mod0); await loaded();
  ok(D.modNow === mod0, 'back to ' + mod0);
}
// passos 2 e 3: theme (Dark, Light, System and the localStorage copy), the Save badge, every icon the page names exists
async function steps23(D, doc, W) {
  const $ = (id) => doc.getElementById(id), root = doc.documentElement;
  const tok = (n) => W.getComputedStyle(root).getPropertyValue(n).trim().toLowerCase();
  const LS = (k) => { try { return W.localStorage.getItem('wotmLevelEditor.' + k); } catch (e) { return 'ERR'; } };
  const t0 = root.dataset.theme;
  $('settings').click();
  const th = [...doc.querySelectorAll('#sTheme input')];
  ok(!!doc.querySelector('dialog[open]') && th.map((o) => o.value).join() === 'dark,light,system' && th.some((o) => o.checked && o.value === t0),
     'theme options: ' + [...doc.querySelectorAll('#sTheme label')].map((o) => o.textContent.trim()).join('/'));
  const pick = (v) => { const r = doc.querySelector(`#sTheme input[value="${v}"]`); r.checked = true; r.dispatchEvent(new Event('change')); };
  pick('light');
  ok(root.dataset.theme === 'light' && tok('--bg') === '#e9ecf0' && LS('theme') === 'light', 'light: bg ' + tok('--bg') + ' ls ' + LS('theme'));
  pick('dark');
  ok(root.dataset.theme === 'dark' && tok('--bg') === '#15171b' && tok('--panel') !== '' && LS('theme') === 'dark', 'dark: bg ' + tok('--bg') + ' panel ' + tok('--panel'));
  pick('system');
  const light = W.matchMedia('(prefers-color-scheme: light)').matches;
  ok(root.dataset.theme === 'system' && tok('--bg') === (light ? '#e9ecf0' : '#15171b') && LS('theme') === 'system', `system (OS light ${light}): bg ${tok('--bg')}`);
  let fired = 0; $('dlg').addEventListener('close', () => fired++, { once: true });
  const wasOpen = $('dlg').open; $('dlg').close('cancel');
  let raf = 0; W.requestAnimationFrame(() => raf++);
  await until(() => root.dataset.theme === t0, 3000);
  // headless Edge may run no frames here, and Chromium fires a dialog's close event with the next frame: fire it by hand then
  const byHand = !fired; if (byHand) $('dlg').dispatchEvent(new W.Event('close'));
  await sleep(50);
  ok(root.dataset.theme === t0 && LS('theme') === t0, `cancel goes back to ${root.dataset.theme} (was ${t0}, ls ${LS('theme')}, open ${wasOpen}, close events ${fired}, raf ${raf}, by hand ${byHand}, rv ${$('dlg').returnValue})`);
  // the unsaved badge on Save
  D.resetAll(); D.applyPatch({});
  const it = D.items().find((x) => !x.copy && x.rec.info.kind === 'destr');
  await sleep(800);   // a nudge within 700 ms of the last one joins its undo step
  D.select(it); D.nudge(1, 0, 0, false);
  ok($('save').classList.contains('dirty') === D.dirty && D.dirty, `Save badge with unsaved changes (dirty ${D.dirty}, class ${$('save').className}, sel ${D.sel && D.sel.rec.info.handle}, hist ${D.history.length}, open ${!!doc.querySelector('dialog[open]')})`);
  D.undo();
  ok($('save').classList.contains('dirty') === D.dirty, 'badge follows dirty after undo (' + D.dirty + ')');
  // icons: every --ic url in the page loads, and is an MDI svg
  const urls = [...new Set([...doc.querySelectorAll('[style*="--ic"]')].map((e) => (e.getAttribute('style').match(/url\(([^)]+)\)/) || [])[1]).filter(Boolean))];
  let bad = [];
  for (const u of urls) { const r = await W.fetch(u); const t = await r.text(); if (!r.ok || !/^<svg [^>]*viewBox="0 0 24 24"><path d="[^"]+" ?\/><\/svg>\s*$/.test(t)) bad.push(u); }
  ok(urls.length > 10 && !bad.length, `icons: ${urls.length} load${bad.length ? ', bad ' + bad.join(' ') : ''}`);
  // controls follow the tokens: a disabled button has no opacity trick, the focus ring exists
  $('check').disabled = true; const cs = W.getComputedStyle($('check'));
  ok(cs.opacity === '1' && cs.cursor === 'not-allowed', 'disabled button: opacity ' + cs.opacity + ', cursor ' + cs.cursor); $('check').disabled = false;
}
// passos 7 e 8: the floating bars, the shortcuts dialog, the hint chip, the loading card; the gizmo's colors, the outlines, hover,
// the grid, the deleted ones' dashed boxes and the changed ones' boxes; frames with and without hover
async function steps78(D, doc, W) {
  const $ = (id) => doc.getElementById(id), cs = (e) => W.getComputedStyle(e), V = D.camera.position.constructor;
  const key = (target, init) => { const e = new W.KeyboardEvent('keydown', Object.assign({ bubbles: true, cancelable: true }, init)); target.dispatchEvent(e); return e; };
  const frame = () => new Promise((r) => W.requestAnimationFrame(() => r()));
  const frames = async (n = 3) => { for (let i = 0; i < n; i++) { await Promise.race([frame(), sleep(200)]); } };
  const cv = $('canvas'), R = () => cv.getBoundingClientRect();
  const toClient = (v3) => { const p = v3.clone().project(D.camera), r = R(); return [r.left + (p.x + 1) / 2 * r.width, r.top + (1 - p.y) / 2 * r.height, p.z]; };
  const ptr = (type, x, y, o = {}) => cv.dispatchEvent(new W.PointerEvent(type, Object.assign({ bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1, button: 0, buttons: type === 'pointerdown' ? 1 : 0 }, o)));
  const LS = (k) => { try { return W.localStorage.getItem('wotmLevelEditor.' + k); } catch (e) { return null; } };
  const was = { grid: LS('grid'), snap: $('snap').checked, look: $('look').checked, fly: D.fly.on };
  D.resetAll(); D.applyPatch({}); D.select(null); D.setPeds(false);
  $('changedOnly').checked = false; D.refreshList();
  // --- 7: the bars
  ok(['tMove', 'tTurn', 'snap', 'snapMove', 'snapTurn'].every((id) => $(id).closest('#toolBar')) && !$('props').querySelector('#tMove, #snap'),
     'Move, Turn and Snap are on the view\'s tool bar');
  ok(['look', 'grid', 'layersBtn', 'vFly', 'vOrbit', 'focusSel', 'frame', 'keysBtn'].every((id) => $(id).closest('#overlay')) && $('pedsOn').closest('#layersMenu'),
     'the view bar: game look, grid, layers, fly/orbit, focus, frame all, shortcuts');
  $('snap').checked = false; $('snap').dispatchEvent(new Event('change'));
  const vis = (e) => !!e.offsetParent;
  ok(!vis($('snapMove')) && !vis($('snapTurn')), 'snap off: no step fields');
  $('snap').checked = true; $('snap').dispatchEvent(new Event('change'));
  ok(vis($('snapMove')) && vis($('snapTurn')) && Math.round(parseFloat(cs($('snapMove').closest('.field')).width)) === 56, 'snap on: the step fields (' + cs($('snapMove').closest('.field')).width + ')');
  $('snap').checked = was.snap; $('snap').dispatchEvent(new Event('change'));
  const tb = $('toolBar').getBoundingClientRect(), ob = $('overlay').getBoundingClientRect(), vb = $('view').getBoundingClientRect();
  ok(tb.right < ob.left && tb.left >= vb.left && ob.right <= vb.right, `bars side by side at ${W.innerWidth}: tool ${Math.round(tb.left)}-${Math.round(tb.right)}, view ${Math.round(ob.left)}-${Math.round(ob.right)}`);
  $('vOrbit').click();
  ok(!D.fly.on && $('vOrbit').classList.contains('on') && !$('vFly').classList.contains('on') && D.hintKey === 'orbit' && $('hint').textContent === D.HINTS.orbit, 'Orbit: ' + $('hint').textContent);
  $('vFly').click();
  ok(D.fly.on && $('vFly').classList.contains('on') && D.hintKey === 'fly' && /Right-drag to look/.test($('hint').textContent), 'Fly: ' + $('hint').textContent);
  ok($('focusSel').disabled, 'Focus is off with nothing selected');
  $('layersBtn').click();
  ok(!$('layersMenu').hidden && $('layersBtn').getAttribute('aria-expanded') === 'true', 'layers menu opens');
  $('pedsOn').click();
  ok(D.mode === 'objects' && D.pedsLayer, 'the menu\'s Pedestrians switch is the layer: mode ' + D.mode);
  $('pedsOn').click();
  const any = D.items().find((it) => !it.copy && it.rec.info.kind === 'destr' && it.node.visible);
  D.select(any);
  key(doc.body, { key: 'Escape', code: 'Escape' });
  ok($('layersMenu').hidden && D.sel === any, 'Esc closes the menu first, the selection stays');
  $('layersBtn').click();
  doc.body.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true }));
  ok($('layersMenu').hidden, 'a click elsewhere closes it');
  // --- the shortcuts dialog: ?, F1, the buttons; Esc closes it without deselecting
  key(doc.body, { key: '?', code: 'Slash', shiftKey: true });
  ok($('keysDlg').open, '? opens the shortcuts');
  const txt = $('keysDlg').textContent;
  ok(['Camera', 'Select', 'Edit', 'View', 'File'].every((s) => txt.includes(s)) && $('keysDlg').querySelectorAll('.kl dt').length === 28 &&
     /Nudge along the axis nearest to the view/.test(txt) && /Box select \(the kinds shown in the list\)/.test(txt), 'its 28 rows in five groups (' + $('keysDlg').querySelectorAll('.kl dt').length + ')');
  key(doc.body, { key: 'Escape', code: 'Escape' });
  key(doc.body, { key: 'Delete', code: 'Delete' });
  ok(D.sel === any && any.node.visible, 'keys under the dialog leave the selection');
  $('keysDlg').close();
  await sleep(50);
  ok(D.sel === any, 'closed: still selected');
  $('filter').focus();
  key($('filter'), { key: 'F1', code: 'F1' });
  ok($('keysDlg').open, 'F1 opens it, from a field too');
  $('keysDlg').close(); $('filter').blur();
  $('keysBtn').click(); ok($('keysDlg').open, 'the view bar\'s keyboard button'); $('keysDlg').close();
  $('help').click(); ok($('keysDlg').open, 'the top bar\'s help button'); $('keysDlg').close();
  await sleep(50);
  // --- the hint by context

    await steps01(D, doc, W);
    if (!Q.has('skip4')) await steps4(D, doc, W);
    await steps23(D, doc, W);
    if (!Q.has('skip56')) await steps56(D, doc, W);
    if (!Q.has('skip78')) await steps78(D, doc, W);
    if (!Q.has('skip910')) await steps910(D, doc, W);
    const errs = [...doc.querySelectorAll('#output .line.err')].map((d) => d.textContent).filter((t) => !/an error|Check found|bad name|start with _|Couldn't save/.test(t));
    say('log errors: ' + (errs.join(' | ') || 'none'));
  } catch (e) { if (!e.done) say('FAIL ERR ' + e.stack); }
  say('DONE');
})();
