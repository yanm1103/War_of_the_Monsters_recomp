<!doctype html>
<html><head><meta charset="utf-8"><title>shot</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}iframe{border:0;width:100%;height:100%;display:block}
#out{position:fixed;left:0;bottom:0;color:#ff0;font:11px monospace;background:#0008;z-index:9;margin:0}</style></head>
<body>
<pre id="out"></pre>
<script>
// capture harness: /_shot.html?stage=CENTRAL&look=1&view=game|over|x,y,z,yaw,pitch&sel=0x...
const q = new URLSearchParams(location.search);
try { if (q.has('look')) localStorage.setItem('wotmLevelEditor.gameLook', q.get('look')); } catch (e) {}
try { localStorage.setItem('wotmLevelEditor.view', 'fly'); localStorage.setItem('wotmLevelEditor.grid', q.get('grid') || '0'); } catch (e) {}
const f = document.createElement('iframe');
f.src = '/?debug&stage=' + encodeURIComponent(q.get('stage') || 'CENTRAL');
document.body.appendChild(f);
const say = (s) => { if (q.has('info')) document.getElementById('out').textContent += s + '\n'; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  let D;
  for (let i = 0; i < 900; i++) { await sleep(100); D = f.contentWindow.wotmDebug; if (D && D.items().length) break; }
  if (!D || !D.items().length) { say('no stage'); return; }
  const W = f.contentWindow, THREE = null;
  const its = D.items();
  let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (const it of its) {
    const p = it.node.getWorldPosition(new D.camera.position.constructor());
    for (const [k, a] of [[0, 'x'], [1, 'y'], [2, 'z']]) { mn[k] = Math.min(mn[k], p[a]); mx[k] = Math.max(mx[k], p[a]); }
  }
  const c = mn.map((v, k) => (v + mx[k]) / 2), sz = mx.map((v, k) => v - mn[k]);
  const v = q.get('view') || 'over';
  if (q.get('sel')) { const it = its.find((x) => x.rec.info.handle === q.get('sel')); if (it) D.select(it); }
  D.setView(true);
  if (v === 'game') {
    D.camera.position.set(c[0], mn[1] + (+q.get('h') || 600), c[2] + sz[2] * (+q.get('back') || 0.3));
    D.fly.yaw = +q.get('yaw') || 0; D.fly.pitch = q.has('pitch') ? +q.get('pitch') : -0.3;
  } else if (v !== 'over') {
    const a = v.split(',').map(Number);
    D.camera.position.set(a[0], a[1], a[2]); D.fly.yaw = a[3]; D.fly.pitch = a[4];
  }
  say(`center ${c.map(Math.round)} size ${sz.map(Math.round)} cam ${D.camera.position.toArray().map(Math.round)} yaw ${D.fly.yaw} pitch ${D.fly.pitch}`);
  if (q.get('js')) { try { new Function('D', 'W', 'say', q.get('js'))(D, W, say); } catch (e) { say('ERR ' + e); } }
  await sleep(+q.get('wait') || 3000);
  say('ready');
})();
</script>
</body></html>
